<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/sege-command/">
<title>Sports Physicals</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
  :root{--ground:#f6f8fa;--surface:#fff;--surface-2:#eef2f7;--border:#e2e7ee;--ink:#17212f;--muted:#5c6875;--faint:#8a97a6;--accent:#0e7c86;--accent-soft:#d9eef0;--accent-ink:#0a5a62;--ok:#1f9d5b;--ok-bg:#e4f5ec;--warn:#c07708;--warn-bg:#faefdc;--bad:#d1453b;--bad-bg:#fbe4e2;--idle:#8a97a6;--idle-bg:#eceff3;--shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.05);}
  @media (prefers-color-scheme:dark){:root{--ground:#0e1319;--surface:#161d27;--surface-2:#1e2833;--border:#28323f;--ink:#e8edf4;--muted:#93a2b3;--faint:#6b7888;--accent:#26b3bd;--accent-soft:#123037;--accent-ink:#7fd8de;--ok:#39c07d;--ok-bg:#12291f;--warn:#e0a13a;--warn-bg:#2c2413;--bad:#e5695f;--bad-bg:#2e1a19;--idle:#6b7888;--idle-bg:#1c242e;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5}
  .wrap{max-width:1240px;margin:0 auto;padding:0 16px 60px}
  header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-bottom:16px;position:sticky;top:0;background:var(--ground);padding:12px 0;z-index:20;border-bottom:1px solid var(--border)}
  .logo{width:38px;height:38px;border-radius:9px;overflow:hidden;background:#fff;box-shadow:var(--shadow);flex:none}.logo img{width:100%;height:100%;object-fit:cover;display:block}
  .title{margin-right:auto;min-width:150px}.title h1{font-size:20px;font-weight:750;letter-spacing:-.02em}.title p{color:var(--muted);font-size:12px}
  .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
  .btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
  nav.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px;margin-bottom:16px;overflow-x:auto;border:1px solid var(--border)}
  nav.tabs button{flex:1;min-width:max-content;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:13px;padding:8px 14px;border-radius:8px;cursor:pointer}
  nav.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
  .fg{display:flex;flex-direction:column;gap:3px}.fg label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
  .fg select,.fg input{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;font-size:12.5px;font-weight:600;min-width:130px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .card h3{padding:12px 16px;font-size:13px;font-weight:700;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center}.card h3 .count{margin-left:auto;color:var(--muted);font-weight:600;font-size:12px}
  .row{display:flex;align-items:center;gap:11px;padding:10px 16px;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.row .main{flex:1;min-width:0}
  .row.clk{cursor:pointer}.row.clk:hover{background:var(--surface-2)}.row .name{font-weight:600}.row .sub{color:var(--muted);font-size:12px;margin-top:1px}
  .pill{font-size:11px;font-weight:650;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-idle{background:var(--idle-bg);color:var(--faint)}.p-prog{background:var(--accent-soft);color:var(--accent-ink)}
  .score{font-weight:800;font-variant-numeric:tabular-nums;font-size:16px;min-width:34px;text-align:center;padding:4px 6px;border-radius:8px}
  .s-hi{background:var(--ok);color:#fff}.s-md{background:var(--warn);color:#fff}.s-lo{background:var(--idle-bg);color:var(--faint)}
  .spark{display:flex;gap:2px;align-items:flex-end;height:20px}.spark i{width:7px;background:var(--accent);border-radius:2px;display:block}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}.stat b{font-size:19px;font-weight:750;display:block}.stat span{font-size:11px;color:var(--muted)}
  .msg{padding:40px;text-align:center;color:var(--muted)}
  .gate{position:fixed;inset:0;background:var(--ground);z-index:9999;display:grid;place-items:center;padding:20px}
  .gate .box{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:26px;max-width:400px;width:100%;text-align:center}
  .gate input{width:100%;border:1px solid var(--border);background:var(--ground);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;margin:10px 0}
  .intel{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.intel{grid-template-columns:1fr}}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px}.kv:last-child{border-bottom:0}.kv b{font-weight:650}
  .sugg{background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.55;margin-bottom:12px}
  .sugg h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:99}#toast.show{opacity:1}
</style>
<style>
  /* page-specific: seasonality strip + sport chips */
  .season{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin:10px 0 4px}
  .season i{height:34px;border-radius:4px;background:var(--idle-bg);display:block;position:relative}
  .season i.on{background:var(--accent)}.season i.peak{background:var(--bad)}
  .season-lab{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;font-size:9.5px;color:var(--faint);text-align:center;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px}
  .chip{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
  .chip b{color:var(--accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
  .num{font-variant-numeric:tabular-nums}
  .warn{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:11px 14px;font-size:12.5px;line-height:1.5;margin-bottom:12px}
  .warn b{font-weight:750}
  table.tbl{width:100%;border-collapse:collapse;font-size:13px}
  table.tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:8px 16px;border-bottom:1px solid var(--border)}
  table.tbl td{padding:8px 16px;border-bottom:1px solid var(--border);vertical-align:top}
  table.tbl tr:last-child td{border-bottom:0}
</style>
</head>
<body>
<div id="gate" class="gate" style="display:none"><div class="box">
  <div class="logo" style="margin:0 auto 12px"><img src="./sege-mark.png" alt="SEGE"></div>
  <h1 style="font-size:19px;font-weight:750">Sports Physicals</h1>
  <p style="color:var(--muted);font-size:13px;margin-top:4px">Private — staff sign-in required.</p>
    <button class="btn" style="width:100%;margin-bottom:8px;justify-content:center;font-weight:700" onclick="ghLogin()">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" style="margin-right:7px"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A7.995 7.995 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      Sign in with GitHub</button>
    <div style="display:flex;align-items:center;gap:8px;margin:10px 0;color:var(--faint);font-size:11px"><span style="flex:1;height:1px;background:var(--border)"></span>OR<span style="flex:1;height:1px;background:var(--border)"></span></div>
  <input id="em" type="email" placeholder="you@togohealth.com" autocomplete="email">
  <button class="btn pri" style="width:100%" onclick="sendLink()">Send magic link</button>
  <p id="gm" style="color:var(--muted);font-size:12px;margin-top:10px"></p>
</div></div>

<div class="wrap" id="app" style="visibility:hidden">
  <header class="top">
    <div class="logo"><img src="./sege-mark.png" alt="SEGE"></div>
    <div class="title"><h1>Sports Physicals</h1><p>Venture research — market sizing and target list</p></div>
    <div class="right">
      <a class="btn" href="./">🏠 Command Center</a>
      <a class="btn" href="./targets.html" title="Targeting for the existing organizations">🎯 Targets</a>
      <button class="btn" onclick="loadTab()">↻ Refresh</button>
      <span id="who" style="font-size:12px;color:var(--muted)"></span>
      <button class="btn" onclick="signOut()">Sign out</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button aria-selected="true"  data-t="schools">🏫 Schools</button>
    <button aria-selected="false" data-t="sports">🥇 Sports</button>
    <button aria-selected="false" data-t="rules">📋 Rules &amp; season</button>
    <button aria-selected="false" data-t="market">📈 Market</button>
  </nav>
  <div id="view"><div class="msg">Loading…</div></div>
</div>
<div id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://sdbkvklthqvwbepyebnp.supabase.co','sb_publishable_ikAih-gI_I4HBxhI4JNa1Q_cOAvrWAz');
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const n=v=>v==null?'—':Number(v).toLocaleString();
let tab='schools', me=null, f={};

/* ── auth: identical to targets.html — GitHub OAuth, magic link fallback ── */
window.ghLogin=async()=>{const {error}=await sb.auth.signInWithOAuth({provider:'github',options:{redirectTo:location.href.split('#')[0]}});
  if(error){const m=$('#gm');if(m)m.textContent='GitHub sign-in not enabled yet: '+error.message;}};
window.sendLink=async()=>{const e=$('#em').value.trim();if(!e)return;
  const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split('#')[0],shouldCreateUser:false}});
  $('#gm').textContent=error?('Error: '+error.message+' — ask an admin to invite you'):'Check your email for the sign-in link.';};
window.signOut=async()=>{await sb.auth.signOut();location.reload();};
function show(a){$('#gate').style.display=a?'none':'grid';$('#app').style.visibility=a?'visible':'hidden';}

$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  tab=b.dataset.t;f={};loadTab();});

window.loadTab=()=>({schools:tSchools,sports:tSports,rules:tRules,market:tMarket}[tab])();

/* generic filter bar (same shape as targets.html so the two pages feel like one app) */
function filterBar(dims){
  const el=document.createElement('div');el.className='filters';
  dims.forEach(d=>{
    const g=document.createElement('div');g.className='fg';g.innerHTML=`<label>${d.label}</label>`;
    if(d.type==='select'){const s=document.createElement('select');
      s.innerHTML=d.opts.map(o=>`<option value="${o[0]}"${f[d.key]===o[0]?' selected':''}>${o[1]}</option>`).join('');
      s.onchange=()=>{f[d.key]=s.value;loadTab();};g.appendChild(s);}
    else{const i=document.createElement('input');i.placeholder=d.ph||'';i.value=f[d.key]||'';
      i.oninput=()=>{f[d.key]=i.value;clearTimeout(window._d);window._d=setTimeout(loadTab,400);};g.appendChild(i);}
    el.appendChild(g);});
  return el;
}
/* PostgREST reports an absent relation as "Could not find the table … in the schema
   cache", not "does not exist" — match both or this hint never shows. */
const missingTable=m=>/does not exist|could not find the table|schema cache/i.test(m||'');
const err=(v,e)=>v.insertAdjacentHTML('beforeend',`<div class="msg">${missingTable(e.message)
  ?'The sports tables are not in Supabase yet — apply <b>sql/sports_physical_tables.sql</b> and run the pipeline with <b>--supabase</b> on the mini.'
  :'Error: '+esc(e.message)}</div>`);

/* ── 🏫 SCHOOLS — the call list ── */
async function tSchools(){
  const v=$('#view');v.innerHTML='<div class="msg">Loading schools…</div>';
  let q=sb.from('v_sp_target_school').select('*').order('est_athletes',{ascending:false,nullsFirst:false}).limit(300);
  if(f.cls) q=q.eq('classification',f.cls);
  if(f.region) q=q.eq('region',f.region);
  if(f.ad==='y') q=q.not('athletic_director_email','is',null);
  if(f.ad==='n') q=q.is('athletic_director_email',null);
  if(f.min) q=q.gte('est_athletes',Number(f.min));
  if(f.q) q=q.ilike('uhsaa_name','%'+f.q+'%');
  const {data,error}=await q;
  v.innerHTML='';
  v.appendChild(filterBar([
    {key:'cls',label:'Classification',type:'select',opts:[['','All'],['6A','6A'],['5A','5A'],['4A','4A'],['3A','3A'],['2A','2A'],['1A','1A']]},
    {key:'min',label:'Min est. athletes',type:'select',opts:[['','Any'],['400','400+'],['250','250+'],['120','120+']]},
    {key:'ad',label:'AD email',type:'select',opts:[['','Either'],['y','On file'],['n','Missing']]},
    {key:'q',label:'Search',type:'text',ph:'school…'}]));
  if(error){err(v,error);return;}
  const rows=data||[];
  const ath=rows.reduce((a,b)=>a+(b.est_athletes||0),0);
  const withAd=rows.filter(r=>r.athletic_director_email).length;
  const trainers=rows.filter(r=>r.athletic_trainer).length;
  v.insertAdjacentHTML('beforeend',`<div class="stats">
    <div class="stat"><b class="num">${rows.length}</b><span>schools shown</span></div>
    <div class="stat"><b class="num">${n(ath)}</b><span>est. athletes</span></div>
    <div class="stat"><b class="num">${withAd}</b><span>AD email on file</span></div>
    <div class="stat"><b class="num">${rows.length-trainers}</b><span>no athletic trainer</span></div></div>`);
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<h3>🏫 UHSAA member schools <span class="count">sorted by estimated athlete volume</span></h3>`;
  rows.forEach(d=>{
    const r=document.createElement('div');r.className='row clk';r.onclick=()=>school(d.uhsaa_school_id);
    r.innerHTML=`<div class="score ${(d.est_athletes||0)>=400?'s-hi':(d.est_athletes||0)>=200?'s-md':'s-lo'}">${d.est_athletes??'?'}</div>
      <div class="main"><div class="name">${esc(d.uhsaa_name)} ${d.classification?`<span class="pill p-prog">${esc(d.classification)}</span>`:''}${d.is_charter?' <span class="pill p-idle">charter</span>':''}${d.athletic_trainer?'':' <span class="pill p-warn">no trainer</span>'}</div>
      <div class="sub">${esc(d.city||d.district||'')}${d.district?' · '+esc(d.district)+' district':''} · ${d.coached_sports??'?'} coached sports · grades 7-12 enrolment ${n(d.enrollment_7_12)}${d.athletic_director?' · AD '+esc(d.athletic_director):''}</div></div>`;
    c.appendChild(r);});
  if(!rows.length)c.insertAdjacentHTML('beforeend','<div class="msg">No schools match.</div>');
  v.appendChild(c);
}

/* ── one school: staff, sports, and what to say ── */
window.school=async(id)=>{
  const v=$('#view');v.innerHTML='<div class="msg">Loading school…</div>';
  const [{data:t},{data:staff},{data:sports}]=await Promise.all([
    sb.from('v_sp_target_school').select('*').eq('uhsaa_school_id',id).limit(1),
    sb.from('sp_uhsaa_staff').select('role,name,email').eq('uhsaa_school_id',id),
    sb.from('sp_school_sport').select('season,sport,coach,coach_email').eq('uhsaa_school_id',id)]);
  const d=(t||[])[0];
  if(!d){v.innerHTML='<div class="msg">Not found</div>';return;}
  const bySeason={};(sports||[]).forEach(s=>{(bySeason[s.season||'Other']=bySeason[s.season||'Other']||[]).push(s);});
  const why=[];
  if(!d.athletic_trainer) why.push('No athletic trainer listed — nobody on staff owns clearance paperwork.');
  if((d.est_athletes||0)>=350) why.push(`Roughly ${n(d.est_athletes)} athletes to clear, so one on-site evening covers most of the school.`);
  if((d.coached_sports||0)>=28) why.push(`${d.coached_sports} of ${d.sanctioned_sports_listed} sanctioned sports have a named coach — a broad program, so season start dates are spread right across the year.`);
  if(d.is_charter) why.push('Charter LEA — decisions do not have to route through a district office.');
  v.innerHTML=`<div class="filters"><button class="btn" onclick="loadTab()">← Back to schools</button></div>
    <div class="card"><h3>${esc(d.uhsaa_name)} ${esc(d.mascot||'')} <span class="count">${esc(d.classification||'')} · Region ${esc(d.region||'?')} · ${esc(d.city||'')}</span></h3>
      <div style="padding:14px 16px">
        <div class="stats" style="margin-bottom:12px">
          <div class="stat"><b class="num">${d.est_athletes??'?'}</b><span>est. athletes</span></div>
          <div class="stat"><b class="num">${n(d.enrollment_7_12)}</b><span>grades 7-12</span></div>
          <div class="stat"><b class="num">${d.coached_sports??'?'}</b><span>sports with a coach</span></div>
          <div class="stat"><b class="num">${d.sanctioned_sports_listed??'?'}</b><span>sanctioned for this class</span></div></div>
        <div class="warn">UHSAA lists every sport sanctioned for a school's classification, not the ones it fields. <b>Sanctioned</b> is the menu; <b>with a coach</b> is the closest fielding signal available, and still only a proxy.</div>
        ${why.length?`<div class="sugg"><h4>Why this school</h4>• ${why.map(esc).join('<br>• ')}</div>`:''}
        <div class="grid2">
          <div><h4 style="font-size:12px;text-transform:uppercase;color:var(--faint);margin-bottom:6px">Athletics staff</h4>
            ${(staff||[]).map(s=>`<div class="kv"><span>${esc(s.role)}</span><b>${esc(s.name||'—')}${s.email?` · <a href="mailto:${esc(s.email)}">${esc(s.email)}</a>`:''}</b></div>`).join('')||'<div class="sub">None listed</div>'}
            <div class="kv"><span>Phone</span><b>${esc(d.phone||'—')}</b></div>
            <div class="kv"><span>Website</span><b>${d.website?`<a href="${esc(d.website)}" target="_blank" rel="noopener">${esc(d.website)}</a>`:'—'}</b></div>
          </div>
          <div><h4 style="font-size:12px;text-transform:uppercase;color:var(--faint);margin-bottom:6px">Sports fielded</h4>
            ${Object.entries(bySeason).map(([s,list])=>`<div class="kv"><span>${esc(s)}</span><b>${list.length}</b></div>
              <div class="sub" style="margin:2px 0 8px">${list.map(x=>esc(x.sport)).join(' · ')}</div>`).join('')||'<div class="sub">None listed</div>'}
          </div>
        </div>
      </div></div>`;
};

/* ── 🥇 SPORTS — which sports drive the exam requirement ── */
async function tSports(){
  const v=$('#view');v.innerHTML='<div class="msg">Loading sports…</div>';
  const [{data:cat,error:e1},{data:off,error:e2}]=await Promise.all([
    sb.from('sp_sport').select('*').order('season').order('sport'),
    sb.from('sp_school_sport').select('sport,season')]);
  v.innerHTML='';
  if(e1){err(v,e1);return;}
  const count={};(off||[]).forEach(o=>{count[o.sport]=(count[o.sport]||0)+1;});
  const req=(cat||[]).filter(c=>c.physical_required==='yes').length;
  v.insertAdjacentHTML('beforeend',`<div class="stats">
    <div class="stat"><b class="num">${(cat||[]).length}</b><span>sports &amp; activities catalogued</span></div>
    <div class="stat"><b class="num">${req}</b><span>require a physical</span></div>
    <div class="stat"><b class="num">${Object.keys(count).length}</b><span>distinct sports</span></div>
    <div class="stat"><b class="num">${(off||[]).length}</b><span>school-sport listings</span></div></div>
    <div class="warn">The <b>listed</b> column counts member schools where UHSAA sanctions the sport — for most sports that is all 162, because the page shows the classification's whole menu. <b>Coached</b> counts the schools naming a coach, which is the nearest thing to a count of programs actually fielded.</div>`);
  ['Fall','Winter','Spring',null].forEach(season=>{
    const list=(cat||[]).filter(c=>season?c.season===season:!['Fall','Winter','Spring'].includes(c.season));
    if(!list.length)return;
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<h3>${season?esc(season)+' season':'Year-round &amp; activities'} <span class="count">${list.length}</span></h3>
      <table class="tbl"><thead><tr><th>Sport</th><th>Gender</th><th>Body</th><th>Physical</th><th class="num">Listed</th><th class="num">Coached</th><th>Note</th></tr></thead>
      <tbody>${list.map(s=>`<tr>
        <td><b>${esc(s.sport)}</b>${s.classifications?` <span class="pill p-idle">${esc(s.classifications)}</span>`:''}</td>
        <td>${esc(s.gender||'—')}</td><td>${esc((s.body_code||'').toUpperCase())}</td>
        <td><span class="pill ${s.physical_required==='yes'?'p-ok':s.physical_required==='no'?'p-idle':'p-warn'}">${esc(s.physical_required||'?')}</span></td>
        <td class="num">${s.schools_listed??count[s.sport]??'—'}</td>
        <td class="num">${s.schools_with_coach??'—'}</td>
        <td class="sub">${esc(s.note||'')}</td></tr>`).join('')}</tbody></table>`;
    v.appendChild(c);});
}

/* ── 📋 RULES & SEASON — who requires an exam, and when the demand lands ── */
async function tRules(){
  const v=$('#view');v.innerHTML='<div class="msg">Loading rules…</div>';
  const {data,error}=await sb.from('sp_sanctioning_body').select('*').order('code');
  v.innerHTML='';
  if(error){err(v,error);return;}
  const unver=(data||[]).filter(b=>!b.verified).length;
  if(unver)v.insertAdjacentHTML('beforeend',`<div class="warn"><b>${unver} of ${(data||[]).length} sanctioning bodies are still unverified.</b> Only rows marked verified have had the actual rulebook read. Do not size a market off an unverified row.</div>`);
  /* seasonality: the exam-validity window drives when the work lands, not the sport calendar */
  const uhsaa=(data||[]).find(b=>b.code==='uhsaa');
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<h3>📅 When the demand lands <span class="count">exam-validity window, not the game calendar</span></h3>
    <div style="padding:12px 16px">
      <div class="sub" style="margin-bottom:6px">${esc(uhsaa?.validity_rule||'Validity rule not loaded')}</div>
      <div class="season">${['J','F','M','A','M','J','J','A','S','O','N','D'].map((_,i)=>
        `<i class="${[2,3,4].includes(i)?'peak':[5,6,7].includes(i)?'on':''}"></i>`).join('')}</div>
      <div class="season-lab">${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map(m=>`<span>${m}</span>`).join('')}</div>
      <div class="sub" style="margin-top:8px">Red = the window opens and exams performed then carry the longest validity; teal = the school-year scramble before fall practice. Everything else is off-season capacity looking for a use.</div>
    </div>`;
  v.appendChild(c);
  const t=document.createElement('div');t.className='card';
  t.innerHTML=`<h3>📋 Who requires a pre-participation exam <span class="count">${(data||[]).length} bodies</span></h3>
    <table class="tbl"><thead><tr><th>Body</th><th>Scope</th><th>Required</th><th>Form</th><th>Who may sign</th><th>Status</th></tr></thead>
    <tbody>${(data||[]).map(b=>`<tr>
      <td><b>${esc(b.name)}</b><div class="sub">${b.source_url?`<a href="${esc(b.source_url)}" target="_blank" rel="noopener">source</a>`:''}</div></td>
      <td class="sub">${esc(b.scope||'')}</td>
      <td><span class="pill ${b.physical_required==='yes'?'p-ok':b.physical_required==='no'?'p-idle':'p-warn'}">${esc(b.physical_required||'?')}</span></td>
      <td class="sub">${esc(b.form_name||'—')}</td>
      <td class="sub">${esc(b.who_may_sign||'—')}</td>
      <td><span class="pill ${b.verified?'p-ok':'p-warn'}">${b.verified?'verified':'to verify'}</span></td>
    </tr>${b.note?`<tr><td colspan="6" class="sub" style="padding-top:0">${esc(b.note)}</td></tr>`:''}`).join('')}</tbody></table>`;
  v.appendChild(t);
  const r=document.createElement('div');r.className='card';
  r.innerHTML=`<h3>📜 Rule citations</h3>${(data||[]).filter(b=>b.rule_citation).map(b=>
    `<div class="row"><div class="main"><div class="name">${esc(b.name)}</div><div class="sub">${esc(b.rule_citation)}</div></div></div>`).join('')||'<div class="msg">No citations captured yet.</div>'}`;
  v.appendChild(r);
}

/* ── 📈 MARKET — TAM, and the arithmetic that produced it ── */
async function tMarket(){
  const v=$('#view');v.innerHTML='<div class="msg">Sizing…</div>';
  const [{data:seg,error:e1},{data:mk}]=await Promise.all([
    sb.from('v_sp_market_segment').select('*'),
    sb.from('sp_school_market').select('est_athletes,is_uhsaa_member,participation_rate')]);
  v.innerHTML='';
  if(e1){err(v,e1);return;}
  const price=Number(f.price||35), attach=Number(f.attach||40)/100;
  v.appendChild(filterBar([
    {key:'price',label:'$ per physical',type:'select',opts:[['25','$25'],['35','$35'],['45','$45'],['60','$60'],['85','$85']]},
    {key:'attach',label:'Share we capture',type:'select',opts:[['40','40%'],['15','15%'],['25','25%'],['60','60%'],['80','80%']]}]));
  const rows=seg||[];
  const schools=rows.reduce((a,b)=>a+(b.athletic_prospect_schools||b.schools||0),0);
  const ath=rows.reduce((a,b)=>a+Number(b.est_athletes||0),0);
  const uhsaaAth=(mk||[]).filter(m=>m.is_uhsaa_member).reduce((a,b)=>a+(b.est_athletes||0),0);
  const tam=ath*price, sam=uhsaaAth*price, rev=uhsaaAth*attach*price;
  v.insertAdjacentHTML('beforeend',`<div class="warn"><b>Every athlete number on this page is an estimate</b>, not a count: grade 7-12 enrolment × a participation rate stored per row. Enrolment is the most recent USBE fall count, which lags the current year. Treat these as order-of-magnitude.</div>
    <div class="stats">
      <div class="stat"><b class="num">${n(schools)}</b><span>schools with a program, grade 7+</span></div>
      <div class="stat"><b class="num">${n(ath)}</b><span>est. athletes statewide</span></div>
      <div class="stat"><b class="num">$${n(Math.round(tam))}</b><span>TAM at $${price}/exam</span></div>
      <div class="stat"><b class="num">$${n(Math.round(sam))}</b><span>UHSAA-only SAM</span></div>
      <div class="stat"><b class="num">$${n(Math.round(rev))}</b><span>revenue at ${Math.round(attach*100)}% capture</span></div>
    </div>`);
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<h3>📈 By segment <span class="count">school category × governance</span></h3>
    <table class="tbl"><thead><tr><th>Category</th><th>Type</th><th class="num">Schools</th><th class="num">UHSAA members</th><th class="num">Grades 7-12</th><th class="num">Est. athletes</th><th class="num">At $${price}</th></tr></thead>
    <tbody>${rows.sort((a,b)=>Number(b.est_athletes||0)-Number(a.est_athletes||0)).map(s=>`<tr>
      <td><b>${esc(s.school_category||'—')}</b></td>
      <td class="sub">${s.is_private?'private':s.is_charter?'charter':'district'}</td>
      <td class="num">${n(s.schools)}</td><td class="num">${n(s.uhsaa_member_schools)}</td>
      <td class="num">${n(s.enrollment_7_12)}</td><td class="num">${n(s.est_athletes)}</td>
      <td class="num">$${n(Math.round(Number(s.est_athletes||0)*price))}</td></tr>`).join('')}</tbody></table>`;
  v.appendChild(c);
  const g=document.createElement('div');g.className='card';
  g.innerHTML=`<h3>🧮 What would have to be true</h3>
    <div style="padding:12px 16px">
      <div class="kv"><span>Athletes needing an exam each year (UHSAA members)</span><b class="num">${n(uhsaaAth)}</b></div>
      <div class="kv"><span>…of which return on Form B with no history change</span><b>a real and unmeasured share — Form B lets a returning athlete be cleared without a new exam</b></div>
      <div class="kv"><span>Exams per clinician-evening at ~4/hour over 4 hours</span><b class="num">16</b></div>
      <div class="kv"><span>School-evenings to clear ${Math.round(attach*100)}% of them</span><b class="num">${n(Math.ceil(uhsaaAth*attach/16))}</b></div>
      <div class="kv"><span>Concentrated into the Mar-Jul window, that is per week</span><b class="num">${n(Math.ceil(uhsaaAth*attach/16/20))}</b></div>
      <div class="sub" style="margin-top:8px">The last line is the whole operating problem: demand is seasonal and the exam is cheap, so the business is a staffing-and-scheduling exercise, not a clinical one. That is the same muscle SEGE already has.</div>
    </div>`;
  v.appendChild(g);
}

window.onerror=(m)=>{const v=document.getElementById('view');if(v&&/Loading|Sizing/.test(v.textContent))v.innerHTML='<div class="msg">Script error: '+String(m)+'</div>';};
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){me=session.user.email;$('#who').textContent=me;show(true);loadTab();}else show(false);
  sb.auth.onAuthStateChange((_e,s)=>{if(s){me=s.user.email;$('#who').textContent=me;show(true);loadTab();}});
}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2600);}
window.toast=toast;
boot();   // last: everything is defined by now
</script>
